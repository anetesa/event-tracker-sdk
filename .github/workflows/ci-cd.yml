name: CI/CD

# GitHub Flow: main is always deployable. Feature branches open a PR into main — the `test`
# job gates the merge and always runs, on every push and PR, regardless of what changed.
# `publish-prerelease` only runs on push to main, and only when the SDK itself changed — a new
# tagged release is meant to track SDK versions, not demo-app tweaks. When main advances WITHOUT
# an SDK change, `refresh-latest-apk` instead swaps the demo APK asset on the most recent existing
# release in place (no new tag), so the released APK still always matches current main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {} # manual "release now" escape hatch, bypasses the SDK-changed gate below

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # paths-filter needs history to diff against on non-PR events
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sdk:
              - 'eventtrackersdk/**'
              - 'gradle/libs.versions.toml'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests (SDK + demo app)
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble debug (compile-check both modules)
        run: ./gradlew assembleDebug --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 14

  publish-prerelease:
    needs: [test, changes]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.sdk == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble SDK aar + demo debug APK
        run: ./gradlew :eventtrackersdk:assembleDebug :app:assembleDebug --console=plain

      - name: Compute pre-release tag
        id: vars
        run: echo "tag=sdk-pre-${{ github.run_number }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release with SDK aar + demo APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: SDK pre-release ${{ steps.vars.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            eventtrackersdk/build/outputs/aar/eventtrackersdk-debug.aar
            app/build/outputs/apk/debug/app-debug.apk

  refresh-latest-apk:
    needs: [test, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.sdk == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest release tag
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.latest.outputs.tag != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        if: steps.latest.outputs.tag != ''
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        if: steps.latest.outputs.tag != ''
        run: chmod +x gradlew

      - name: Assemble demo debug APK
        if: steps.latest.outputs.tag != ''
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Swap APK asset on the latest release
        if: steps.latest.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.latest.outputs.tag }}" app/build/outputs/apk/debug/app-debug.apk --clobber
